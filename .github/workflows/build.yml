name: Build Release Binaries
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform.target }} (ubuntu ${{ matrix.platform.ubuntu-version }})
    runs-on: ubuntu-latest
    container: ubuntu:${{ matrix.platform.ubuntu-version }}

    strategy:
      fail-fast: false
      matrix:
        platform:
          # Linux - built separately per Ubuntu version so the resulting
          # binary links against that version's glibc instead of requiring
          # a newer one than the target system has.
          - target: x86_64-unknown-linux-gnu
            ubuntu-version: "20.04"
            name: linux-x86_64-ubuntu20.04
          - target: x86_64-unknown-linux-gnu
            ubuntu-version: "22.04"
            name: linux-x86_64-ubuntu22.04
          - target: x86_64-unknown-linux-gnu
            ubuntu-version: "24.04"
            name: linux-x86_64-ubuntu24.04
          - target: x86_64-unknown-linux-gnu
            ubuntu-version: "26.04"
            name: linux-x86_64-ubuntu26.04

    steps:
      - name: Install Linux dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y curl build-essential pkg-config libpcap-dev ca-certificates

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp target/${{ matrix.platform.target }}/release/pcap2har artifacts/pcap2har-${{ matrix.platform.name }}
          chmod +x artifacts/pcap2har-${{ matrix.platform.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcap2har-${{ matrix.platform.name }}
          path: artifacts/*
          if-no-files-found: error

  merge-artifacts:
    name: Merge all artifacts
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          
      - name: Reorganize artifacts
        run: |
          mkdir -p merged-artifacts
          find all-artifacts -type f -exec cp {} merged-artifacts/ \;
          ls -lh merged-artifacts/
          
      - name: Upload merged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcap2har-all-platforms
          path: merged-artifacts/*
          if-no-files-found: error
