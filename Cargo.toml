[package]
name = "pcap2har"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["Litt1eQ"]
description = "A native Rust PCAP to HAR converter for HTTP/1.x, HTTP/2, HTTP/3, TLS, QUIC, and FastCGI"
license = "MIT"
repository = "https://github.com/Litt1eQ/pcap2har"
homepage = "https://github.com/Litt1eQ/pcap2har"
documentation = "https://github.com/Litt1eQ/pcap2har#readme"
readme = "README.md"
keywords = ["pcap", "har", "http", "network", "packet-analysis"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[dependencies]
aes = "=0.8.4"
pcap-parser = "=0.17.0"
etherparse = "0.16"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
httparse = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
flate2 = "1.1"
url = "2.5"
thiserror = "2.0"
base64 = "0.22"
aes-gcm = "=0.10.3"
chacha20 = "=0.9.1"
chacha20poly1305 = "=0.10.1"
compcol = { version = "=0.6.11", default-features = false, features = ["qpack"] }
hkdf = "=0.12.4"
hmac = "0.12"
sha2 = "=0.10.9"
hex = "0.4"
hex-literal = "=1.0.0"
hpack = "0.3"
rustls = { version = "=0.23.43", default-features = false, features = ["std", "tls12"] }

[dev-dependencies]
proptest = "=1.9.0"
